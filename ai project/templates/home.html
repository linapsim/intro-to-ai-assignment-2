<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Performance Predictor</h2>

    <form id="form">
        <input type="number" id="hours" placeholder="Hours Studied (0-10)" min="0" max="10" required>
        <input type="number" id="scores" placeholder="Previous Scores (0-100)" min="0" max="100" required>
        <input type="number" id="activities" placeholder="Activities (1=Yes, 0=No)" min="0" max="1" required>
        <input type="number" id="sleep" placeholder="Sleep Hours (0-10)" min="0" max="10" required>
        <input type="number" id="papers" placeholder="Practice Papers (0-10)" min="0" max="10" required>

        <button type="submit">Predict</button>
    </form>

    <div id="result"></div>
</div>

<script>
document.getElementById("form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const hours = Number(document.getElementById("hours").value);
    const scores = Number(document.getElementById("scores").value);
    const activities = Number(document.getElementById("activities").value);
    const sleep = Number(document.getElementById("sleep").value);
    const papers = Number(document.getElementById("papers").value);

    // Validation
    if (hours < 0 || hours > 10) {
        alert("Hours must be 0–10");
        return;
    }

    if (scores < 0 || scores > 100) {
        alert("Scores must be 0–100");
        return;
    }

    if (activities !== 0 && activities !== 1) {
        alert("Activities must be 0 or 1");
        return;
    }

    if (sleep < 0 || sleep > 10) {
        alert("Sleep must be 0–10");
        return;
    }

    if (papers < 0 || papers > 10) {
        alert("Papers must be 0–10");
        return;
    }

    const response = await fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            hours,
            scores,
            activities,
            sleep,
            papers
        })
    });

    const result = await response.json();

    const resultDiv = document.getElementById("result");

    // ✅ FIXED HERE
    if (result.prediction) {
        resultDiv.innerHTML = "Prediction: " + result.prediction;

        if (result.prediction === "PASS") {
            resultDiv.style.color = "green";
        } else {
            resultDiv.style.color = "red";
        }

    } else if (result.error) {
        resultDiv.innerHTML = "Error: " + result.error;
        resultDiv.style.color = "black";
    } else {
        resultDiv.innerHTML = "Something went wrong";
    }
});
</script>

</body>
</html>
